<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedAlert - Admin Dashboard</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body class="admin-page">

  <!-- Header -->
  <div class="page-header">
    <div class="logo">⚙️</div>
    <div style="flex:1;">
      <h1>Admin Panel</h1>
      <p>MedAlert System Management</p>
    </div>
    <button class="logout-btn" onclick="logout('login.html')">Logout</button>
  </div>

  <!-- Alert Container -->
  <div id="alert-container" style="padding:12px 16px 0;"></div>

  <!-- Stats Grid -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-number" id="stat-customers">--</div>
      <div class="stat-label">Customers</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="stat-ambulances">--</div>
      <div class="stat-label">Ambulances</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="stat-hospitals">--</div>
      <div class="stat-label">Hospitals</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="stat-active" style="color:#f57c00;">--</div>
      <div class="stat-label">Active Emergencies</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="admin-tabs">
    <button class="admin-tab active" onclick="switchTab('create')">
      ➕ Create User
    </button>
    <button class="admin-tab" onclick="switchTab('customers')">
      👤 Customers
    </button>
    <button class="admin-tab" onclick="switchTab('ambulances')">
      🚑 Ambulances
    </button>
    <button class="admin-tab" onclick="switchTab('hospitals')">
      🏥 Hospitals
    </button>
    <button class="admin-tab" onclick="switchTab('emergencies')">
      🚨 Emergencies
    </button>
  </div>

  <!-- Tab: Create User -->
  <div class="tab-content" id="tab-create">
    <div class="create-user-form">
      <h3>Create New Account</h3>

      <div class="form-group">
        <label>Account Type</label>
        <select id="create-role" onchange="toggleHospitalFields()">
          <option value="customer">👤 Customer (Patient)</option>
          <option value="ambulance">🚑 Ambulance Driver</option>
          <option value="hospital">🏥 Hospital</option>
        </select>
      </div>

      <div class="form-group">
        <label>Name / Username</label>
        <input type="text" id="create-name" placeholder="Enter name" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="text"
          id="create-password"
          placeholder="Set password"
        />
      </div>

      <!-- Hospital-specific fields -->
      <div id="hospital-fields" class="hidden">
        <div class="form-group">
          <label>Hospital Display Name</label>
          <input
            type="text"
            id="hospital-display-name"
            placeholder="Full hospital name (shown to patients)"
          />
        </div>
        <div class="form-group">
          <label>Hospital Address</label>
          <input
            type="text"
            id="hospital-address"
            placeholder="Hospital address"
          />
        </div>
        <div class="form-group">
          <label>Contact Number</label>
          <input
            type="text"
            id="hospital-contact"
            placeholder="Hospital phone number"
          />
        </div>
      </div>

      <button class="btn btn-primary" onclick="createUser()">
        ➕ Create Account
      </button>
    </div>
  </div>

  <!-- Tab: Customers -->
  <div class="tab-content hidden" id="tab-customers">
    <div id="customers-list">
      <p style="color:var(--text-secondary); text-align:center; padding:20px;">
        Loading...
      </p>
    </div>
  </div>

  <!-- Tab: Ambulances -->
  <div class="tab-content hidden" id="tab-ambulances">
    <div id="ambulances-list">
      <p style="color:var(--text-secondary); text-align:center; padding:20px;">
        Loading...
      </p>
    </div>
  </div>

  <!-- Tab: Hospitals -->
  <div class="tab-content hidden" id="tab-hospitals">
    <div id="hospitals-list">
      <p style="color:var(--text-secondary); text-align:center; padding:20px;">
        Loading...
      </p>
    </div>
  </div>

  <!-- Tab: Emergencies -->
  <div class="tab-content hidden" id="tab-emergencies">
    <div id="emergencies-list">
      <p style="color:var(--text-secondary); text-align:center; padding:20px;">
        Loading...
      </p>
    </div>
  </div>

  <!-- Reset Password Modal -->
  <div class="modal-overlay hidden" id="reset-modal">
    <div
      class="modal-sheet"
      style="max-height:auto; padding:24px;"
    >
      <div class="modal-handle"></div>
      <h2 style="margin-bottom:16px;">Reset Password</h2>
      <p
        style="font-size:13px; color:var(--text-secondary); margin-bottom:16px;"
        id="reset-user-info"
      ></p>

      <div class="form-group">
        <label>New Password</label>
        <input
          type="text"
          id="new-password-input"
          placeholder="Enter new password"
        />
      </div>

      <div style="display:flex; gap:10px; margin-top:8px;">
        <button
          class="btn btn-primary"
          onclick="confirmResetPassword()"
          style="flex:1;"
        >
          Reset Password
        </button>
        <button
          class="btn"
          onclick="closeResetModal()"
          style="flex:1; background:var(--border); color:white;"
        >
          Cancel
        </button>
      </div>
    </div>
  </div>

  <script src="../assets/js/common.js"></script>
  <script>
    let currentTab = 'create';
    let resetUserId = null;

    // ---- Auth Guard ----
    window.addEventListener('load', async () => {
      if (!Auth.isLoggedIn()) {
        window.location.href = 'login.html';
        return;
      }
      const user = Auth.getUser();
      if (!user || user.role !== 'admin') {
        window.location.href = 'login.html';
        return;
      }

      await loadStats();
    });

    // ---- Load Stats ----
    async function loadStats() {
      const result = await API.get('/admin/stats');
      if (result.ok && result.data.success) {
        const s = result.data.stats;
        document.getElementById('stat-customers').textContent = s.customers;
        document.getElementById('stat-ambulances').textContent = s.ambulances;
        document.getElementById('stat-hospitals').textContent = s.hospitals;
        document.getElementById('stat-active').textContent = s.activeEmergencies;
      }
    }

    // ---- Tab Switching ----
    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach((el) => {
        el.classList.add('hidden');
      });
      document.querySelectorAll('.admin-tab').forEach((el) => {
        el.classList.remove('active');
      });

      document.getElementById(`tab-${tab}`).classList.remove('hidden');

      const tabButtons = document.querySelectorAll('.admin-tab');
      const tabIndex = ['create', 'customers', 'ambulances', 'hospitals', 'emergencies'].indexOf(tab);
      if (tabButtons[tabIndex]) tabButtons[tabIndex].classList.add('active');

      currentTab = tab;

      // Load data for tab
      if (tab === 'customers') loadUsers('customer');
      else if (tab === 'ambulances') loadUsers('ambulance');
      else if (tab === 'hospitals') loadUsers('hospital');
      else if (tab === 'emergencies') loadEmergencies();
    }

    // ---- Toggle Hospital Fields ----
    function toggleHospitalFields() {
      const role = document.getElementById('create-role').value;
      const fields = document.getElementById('hospital-fields');
      if (role === 'hospital') {
        fields.classList.remove('hidden');
      } else {
        fields.classList.add('hidden');
      }
    }

    // ---- Create User ----
    async function createUser() {
      const role = document.getElementById('create-role').value;
      const name = document.getElementById('create-name').value.trim();
      const password = document.getElementById('create-password').value.trim();

      if (!name || !password) {
        showAlert('alert-container', 'Name and password are required', 'error');
        return;
      }

      const body = { name, password, role };

      if (role === 'hospital') {
        body.hospitalName =
          document.getElementById('hospital-display-name').value.trim() || name;
        body.address = document.getElementById('hospital-address').value.trim();
        body.contactNumber =
          document.getElementById('hospital-contact').value.trim();
      }

      const result = await API.post('/admin/create-user', body);

      if (result.ok && result.data.success) {
        showAlert(
          'alert-container',
          `✅ ${role} account "${name}" created successfully!`,
          'success'
        );

        // Reset form
        document.getElementById('create-name').value = '';
        document.getElementById('create-password').value = '';
        document.getElementById('create-role').value = 'customer';
        document.getElementById('hospital-fields').classList.add('hidden');

        await loadStats();
      } else {
        showAlert(
          'alert-container',
          result.data.message || 'Failed to create user',
          'error'
        );
      }
    }

    // ---- Load Users ----
    async function loadUsers(role) {
      const containerId = `${role}s-list`;
      const container = document.getElementById(containerId);
      container.innerHTML =
        '<p style="color:var(--text-secondary); text-align:center; padding:20px;">Loading...</p>';

      const result = await API.get(`/admin/users/${role}`);

      if (!result.ok || !result.data.success) {
        container.innerHTML =
          '<p style="color:var(--text-secondary); text-align:center; padding:20px;">Failed to load</p>';
        return;
      }

      const users = result.data.users;

      if (users.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <span class="empty-icon">👥</span>
            <h3>No ${role} accounts yet</h3>
            <p>Create one using the Create User tab</p>
          </div>
        `;
        return;
      }

      const roleIcons = {
        customer: '👤',
        ambulance: '🚑',
        hospital: '🏥'
      };

      container.innerHTML = users
        .map(
          (user) => `
        <div class="user-card">
          <div class="user-avatar">${roleIcons[user.role] || '👤'}</div>
          <div class="user-info">
            <div class="user-name">${user.name}</div>
            <div class="user-role">
              ${user.hospitalName ? user.hospitalName + ' • ' : ''}
              ${formatDate(user.createdAt)}
            </div>
            <span class="badge ${user.isActive ? 'badge-active' : 'badge-inactive'}">
              ${user.isActive ? '● Active' : '● Inactive'}
            </span>
          </div>
          <div class="user-actions">
            <button
              class="btn btn-sm"
              style="background:var(--secondary); color:white;"
              onclick="openResetModal('${user._id}', '${user.name}')"
            >
              🔑
            </button>
            <button
              class="btn btn-sm"
              style="background:${user.isActive ? 'var(--warning)' : 'var(--success-light)'}; color:white;"
              onclick="toggleUserStatus('${user._id}', '${containerId}')"
            >
              ${user.isActive ? '🚫' : '✅'}
            </button>
            <button
              class="btn btn-sm btn-danger"
              onclick="deleteUser('${user._id}', '${role}')"
            >
              🗑️
            </button>
          </div>
        </div>
      `
        )
        .join('');
    }

    // ---- Toggle Status ----
    async function toggleUserStatus(userId, containerId) {
      const result = await API.put(`/admin/users/${userId}/toggle-status`, {});

      if (result.ok && result.data.success) {
        showAlert(
          'alert-container',
          `User ${result.data.isActive ? 'activated' : 'deactivated'} successfully`,
          'success'
        );
        // Reload current tab
        await loadUsers(currentTab === 'customers' ? 'customer' : currentTab === 'ambulances' ? 'ambulance' : 'hospital');
        await loadStats();
      } else {
        showAlert('alert-container', result.data.message || 'Failed', 'error');
      }
    }

    // ---- Delete User ----
    async function deleteUser(userId, role) {
      if (!confirm('Are you sure you want to delete this account?')) return;

      const result = await API.delete(`/admin/users/${userId}`);

      if (result.ok && result.data.success) {
        showAlert('alert-container', 'User deleted successfully', 'success');
        await loadUsers(role);
        await loadStats();
      } else {
        showAlert('alert-container', result.data.message || 'Failed', 'error');
      }
    }

    // ---- Reset Password Modal ----
    function openResetModal(userId, userName) {
      resetUserId = userId;
      document.getElementById('reset-user-info').textContent =
        `Resetting password for: ${userName}`;
      document.getElementById('new-password-input').value = '';
      document.getElementById('reset-modal').classList.remove('hidden');
    }

    function closeResetModal() {
      resetUserId = null;
      document.getElementById('reset-modal').classList.add('hidden');
    }

    async function confirmResetPassword() {
      const newPassword = document
        .getElementById('new-password-input')
        .value.trim();

      if (!newPassword || newPassword.length < 4) {
        showAlert('alert-container', 'Password must be at least 4 characters', 'error');
        return;
      }

      const result = await API.put(
        `/admin/users/${resetUserId}/reset-password`,
        { newPassword }
      );

      if (result.ok && result.data.success) {
        showAlert('alert-container', '✅ Password reset successfully!', 'success');
        closeResetModal();
      } else {
        showAlert('alert-container', result.data.message || 'Failed', 'error');
      }
    }

    // ---- Load Emergencies ----
    async function loadEmergencies() {
      const container = document.getElementById('emergencies-list');
      container.innerHTML =
        '<p style="color:var(--text-secondary); text-align:center; padding:20px;">Loading...</p>';

      const result = await API.get('/admin/emergencies');

      if (!result.ok || !result.data.success) {
        container.innerHTML =
          '<p style="color:var(--text-secondary); text-align:center; padding:20px;">Failed to load</p>';
        return;
      }

      const emergencies = result.data.emergencies;

      if (emergencies.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <span class="empty-icon">✅</span>
            <h3>No Emergency Records</h3>
            <p>Emergency logs will appear here</p>
          </div>
        `;
        return;
      }

      const statusColors = {
        pending: '#f57c00',
        ambulance_assigned: '#1565c0',
        ambulance_arrived: '#7b1fa2',
        patient_picked: '#0097a7',
        heading_to_hospital: '#2e7d32',
        hospital_notified: '#558b2f',
        completed: '#4caf50'
      };

      container.innerHTML = emergencies
        .map(
          (e) => `
        <div class="user-card" style="flex-direction:column; align-items:flex-start; gap:8px;">
          <div style="display:flex; width:100%; align-items:center;">
            <div style="flex:1;">
              <div style="font-size:14px; font-weight:700;">${e.patientName}</div>
              <div style="font-size:12px; color:var(--text-secondary);">
                ${getConditionLabel(e.condition)} | ${formatDate(e.createdAt)}
              </div>
            </div>
            <span
              style="
                background:${statusColors[e.status] || '#666'}22;
                color:${statusColors[e.status] || '#666'};
                border:1px solid ${statusColors[e.status] || '#666'};
                padding:3px 8px;
                border-radius:12px;
                font-size:10px;
                font-weight:700;
                text-transform:uppercase;
              "
            >
              ${e.status.replace(/_/g, ' ')}
            </span>
          </div>
          ${e.ambulanceName ? `<div style="font-size:12px; color:var(--text-secondary);">🚑 Ambulance: ${e.ambulanceName}</div>` : ''}
          ${e.selectedHospitalName ? `<div style="font-size:12px; color:var(--text-secondary);">🏥 Hospital: ${e.selectedHospitalName}</div>` : ''}
        </div>
      `
        )
        .join('');
    }
  </script>
</body>
</html>
